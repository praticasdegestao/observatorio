# GitHub Actions: atualiza precos.json de segunda a sexta às 7h (Brasília)
name: Atualizar precos
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
jobs:
  precos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pandas openpyxl xlrd
      - run: python precos_scraper.py
      - run: |
          git config user.name "precos-bot"
          git config user.email "precos-bot@users.noreply.github.com"
          git add precos.json
          git diff --cached --quiet || git commit -m "Atualiza precos.json"
          git push
