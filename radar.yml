# Coloque em .github/workflows/radar.yml no repositório do GitHub Pages
# (o mesmo onde está o HTML do dashboard). Roda todo dia às 06:20 (Brasília).
name: Atualizar radar
on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python radar_scraper.py --dias 60 --saida radar.json
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar.json
          git diff --cached --quiet || git commit -m "Radar: atualização automática $(date +%F)"
          git push
